name: free-llm-daily-research

on:
  schedule:
    # Twice daily: 06:00 and 18:00 UTC (aggressive research - GitHub compute is free)
    - cron: '0 6,18 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'bot/**'
      - '.github/workflows/**'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: free-llm-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run research bot
        env:
          GH_TOKEN: ${{ github.token }}
        run: python bot/research.py

      - name: Clean workspace (keep repo tidy)
        run: |
          rm -rf bot/__pycache__ __pycache__ .pytest_cache
          find . -name '*.pyc' -delete
          find . -type d -name '.venv' -prune -exec rm -rf {} +

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore(results): daily free-LLM research $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
